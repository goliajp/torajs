[workspace]
resolver = "3"
members = [
    "crates/torajs-syscall",
    "crates/torajs-io",
    "crates/torajs-fmt",
    "crates/torajs-mem",
    "crates/torajs-mmalloc",
    "crates/torajs-mutex",
    "crates/torajs-pool",
    "crates/torajs-ucd",
    "crates/torajs-rc",
    "crates/torajs-anyvalue",
    "crates/torajs-throw",
    "crates/torajs-str",
    "crates/torajs-num",
    "crates/torajs-math",
    "crates/torajs-bigint",
    "crates/torajs-arr",
    "crates/torajs-dynobj",
    "crates/torajs-collections",
    "crates/torajs-weak",
    "crates/torajs-cycle",
    "crates/torajs-microtask",
    "crates/torajs-promise",
    "crates/torajs-regex",
    "crates/torajs-fetch",
    "crates/torajs-date",
    "crates/torajs-capture-box",
    "crates/torajs-fs",
    "crates/torajs-meta",
    "crates/torajs-process",
    "crates/torajs-panic",
    "crates/torajs-panic-runtime",
    "crates/torajs-value-drop",
    "crates/torajs-abort",
    "crates/torajs-codec-hex",
    "crates/torajs-runtime",
    "crates/torajs-core",
    "crates/torajs-cli",
    "crates/torajs-embed",
    "crates/torajs-playground-api",
    "labs/0002-inkwell-spike",
    "bench/harness",
    "conformance/runner",
    "conformance/test262-runner",
]

# Centralized metadata for sub-crates that opt-in via `<key>.workspace =
# true` in their own `[package]`. See docs/architecture-rewrite.md for
# the full layered-crate plan + per-crate Cargo.toml template.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/goliajp/torajs"
homepage = "https://github.com/goliajp/torajs"
authors = ["GOLIA K.K."]

# Pinned shared dev/runtime deps. Sub-crates reference with
# `<dep> = { workspace = true }`; root bump rolls through the workspace
# in one commit.
[workspace.dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# Sub-crates opt in via `[lints] workspace = true`. Existing crates
# without the opt-in are unaffected (kept their pre-existing lint
# state) so this addition is non-breaking. New sub-crates land
# warnings-clean.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Phase B: tr binary itself runs at max-opt — affects compile_ms only.
# LTO tunes the `tr` COMPILER binary, NOT the user binary `tr build`
# emits. Measured 2026-05-29 (fat vs false, identical fixtures):
#   - user binary is byte-for-byte identical either way (ackermann
#     72856 B / prime_count 72832 B / array-map-1m 73600 B in BOTH),
#     run_ms unchanged. `tr build` output is set by tr's own LLVM pass
#     (`--opt O3`, main.rs:179) + the link-time `-flto` in
#     ssa_inkwell/link.rs — never by this profile. (The staticlibs baked
#     in via include_bytes! are standalone object archives, not bitcode.)
#   - the `tr` binary itself: fat = thin = 162.9 MB, false = 51 MB
#     (-69%). fat-LTO was *assumed* to speed up `tr build` via the
#     inkwell↔tr cross-crate inlining — measured the OPPOSITE: a
#     1500-fn fixture compiled in min 12.68s / median 15.88s at false
#     vs 22.79s / 23.74s at fat (false is 30-45% FASTER, and lower
#     variance). fat-LTO is a net negative on this 162 MB compiler: 3x
#     the code to page in per `tr build` invocation + over-inlined giant
#     hot fns (lower_expr_inner) thrashing icache. The hottest build
#     (conformance gate) already runs iter/lto=false anyway; and tr
#     build is compile_ms, not run_ms (design pillar #1).
# Net: dropping LTO cuts the tr artifact 69% AND speeds up tr build, at
# zero cost to user-binary perf or size (byte-identical). `thin` is
# strictly worse — same 162.9 MB as fat, no win. So we omit the `lto`
# line entirely: cargo's release-profile default is already lto=false,
# so "no line" == "lto = false" with less noise.
[profile.release]
opt-level = 3
codegen-units = 1
strip = true
# polish A4 (2026-05-24) — `panic = "abort"` is the manifest-stable
# value; the actual `immediate-abort` strategy is opted into via
# RUSTFLAGS+CARGO_UNSTABLE_BUILD_STD env vars in the production
# release script. Keeping the manifest stable lets `cargo test` /
# `cargo build` (no env vars) keep working without nightly.
panic = "abort"

# panic = "abort" on dev for symmetry with release — `cargo test`
# (no --release) inherits from this profile. (panic is "ignored"
# on [profile.test] and [profile.bench] per cargo design; not
# settable there.)
[profile.dev]
panic = "abort"

# Vanilla-Rust honest baseline. Mirrors mailrs's pattern. Use with
# `cargo build --profile release-vanilla` to compare against
# `[profile.release]`'s fat-LTO + codegen-units=1 + strip on the
# same code. Lets us answer "is the perf-first profile actually
# delivering?" with a measurement, not a guess. NOT for deploy.
[profile.release-vanilla]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
strip = false

# hardev devperf #1 — fast iteration profile. Used ONLY for functional
# iteration + the conformance gate (conformance/runner builds tr with
# `--profile iter`). opt-level / LTO / codegen-units do NOT change
# program semantics (textbook invariant), so an `iter`-built tr is
# byte-for-byte stdout-equivalent to a `release`-built tr on every
# conformance case — same coverage, same byte-equal verdict (629/0/1
# proves it empirically). bench + final ship STILL use `--release`
# (fat-LTO ship binary); bench runners hardcode target/release/tr, a
# physically separate artifact from target/iter/tr, so they are
# structurally unaffected. Knobs chosen for fast compile while keeping
# the conformance run fast enough: no whole-program LTO, max codegen
# parallelism, opt-level=1 (NOT 0 — a -O0 tr would make conformance
# case execution too slow, a bad trade).
[profile.iter]
inherits = "release"
lto = false
codegen-units = 256
opt-level = 1
strip = false
