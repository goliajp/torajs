[package]
name = "torajs-process"
description = "Process surface for the torajs AOT TypeScript runtime — process.exit / cwd / env / argv / platform / stdout.write / stderr.write. Layer-3 substrate (P7.h-proc); replaces the process_* family in runtime_str.c."
keywords = ["torajs", "process", "runtime", "ffi"]
categories = ["os", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# v0.7-A3 Step 14-b — 0-libc buffered stdout writer for
# process.stdout.write + flush-before-stderr pattern.
torajs-io = { path = "../torajs-io" }
# v0.7-A5 Step 16-b — 0-libc Mutex<T> backed by __ulock_wait/_wake;
# replaces std::sync::Mutex for ARGV_STATE to drop pthread_mutex_*
# from the user binary's libSystem import table.
torajs-mutex = { path = "../torajs-mutex" }
# v0.7-A5 Step ④ A5-close — fcntl(F_GETPATH) syscall wrapper backing
# process.cwd() without the libc `getcwd` dep. Same Layer-0 crate
# the fs port walks through. envp-based process.env scan needs no
# additional dep — `main`'s 3rd LLVM IR param is forwarded by the
# codegen entry directly to `__torajs_argv_init`.
torajs-syscall = { path = "../torajs-syscall" }
# libc exit / write remain OS-level system symbols (process.exit
# uses libc exit; process.stderr.write uses libc write(2)). Their
# _exit / _write libSystem stubs are already in the cross-holdout
# baseline (panic_runtime backtrace machinery pulls them in too),
# so leaving them here doesn't widen the user binary's import set.
# Cross-tier extern calls (str_alloc_pooled, arr_alloc, arr_push,
# panic) resolve at `tr build` link time against the matching
# sibling staticlibs + runtime_str.c.

[dev-dependencies]
torajs-bench = { path = "../torajs-bench" }

[[bench]]
name = "process"
harness = false
