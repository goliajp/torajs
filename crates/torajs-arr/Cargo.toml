[package]
name = "torajs-arr"
description = "Heap-allocated dynamic Array<T> + Array<Any> substrate for the torajs AOT TypeScript runtime. Layer-3 — push / pop / iter / slice / concat / join / sort and friends, over a refcounted pool-aware backing block. no_std-friendly."
keywords = ["torajs", "array", "vec", "runtime"]
categories = ["data-structures", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-arr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dual emit: `rlib` for cargo workspace + unit tests;
# `staticlib` emits libtorajs_arr.a so the in-house link pipeline
# (torajs-link) bakes it into every `tr build` AOT user binary alongside the other Layer-1+
# staticlibs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# Layer-1 dep: HeapHeader struct + FLAG_STATIC_LITERAL constant +
# __torajs_rc_dec. P4.x torajs-arr is Layer-3 architecturally but
# only uses Layer-1 types here — same dep pattern as torajs-str.
torajs-rc = { path = "../torajs-rc" }
# Polish A3a — panic-free abort for OOM in Array alloc.
torajs-abort = { path = "../torajs-abort" }
# v0.7-A2 step 6b — force-link mmalloc for `__torajs_libc_*` externs.
torajs-mmalloc = { path = "../torajs-mmalloc" }
# v0.7-A3 Step 14-b — 0-libc buffered stdout for arr_print* family.
torajs-io = { path = "../torajs-io" }
# v0.7-A4 Step 15-d/e — 0-libc f64 ↔ string conversion for
# arr_print* + arr_join* f64 element formatting.
torajs-fmt = { path = "../torajs-fmt" }
# RFC 20260821 A2 — the whole-array Str element release reads the
# substring view's own flags and parent offset to decide which slots
# owe anything. Taking those from their defining crate keeps the
# layout in one place rather than mirroring magic offsets here.
torajs-str = { path = "../torajs-str" }

[dev-dependencies]
torajs-bench = { path = "../torajs-bench" }

[[bench]]
name = "arr"
harness = false
