[package]
name = "torajs-promise"
description = "Promise<T> substrate for the torajs AOT TypeScript runtime. Heap layout (64B: header + state + value + callbacks + expando bag + inline reaction) + 5 alloc variants + drop. Resolve/reject + callback chain + drain to microtask queue. .then/.catch/.finally (simple + closure variants) + Promise.all/allSettled/race/any sync combinators + queueMicrotask globals + thenable absorption. Layer-3 substrate. Pairs with torajs-microtask (queue) — Promise queues work onto that crate's enqueue API."
keywords = ["torajs", "promise", "async", "event-loop", "runtime"]
categories = ["concurrency", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-promise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dual emit: `rlib` for cargo workspace + unit tests; `staticlib`
# emits libtorajs_promise.a so the in-house link pipeline (torajs-link) bakes it into every
# `tr build` AOT user binary alongside the other Layer-1+ staticlibs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# v0.7-A2 step 6b — force-link mmalloc for `__torajs_libc_*` + memcpy.
torajs-mmalloc = { path = "../torajs-mmalloc" }
# RFC 20260905 residue 1 — the handler dispatch reads the closure
# header's receiver-first flag.
torajs-rc = { path = "../torajs-rc" }

[dev-dependencies]
torajs-bench = { path = "../torajs-bench" }
# the frame tests run their jobs on the real queue
torajs-microtask = { path = "../torajs-microtask" }

[[bench]]
name = "promise"
harness = false
