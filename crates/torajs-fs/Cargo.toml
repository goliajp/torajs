[package]
name = "torajs-fs"
description = "Synchronous filesystem substrate for the torajs AOT TypeScript runtime — readFileSync / writeFileSync / appendFileSync / existsSync / mkdirSync / unlinkSync / statSync.size / readdirSync. Path bytes flow through tora Str; bodies return as Str. Layer-3 substrate (P7.d); replaces runtime_str.c's fs_* family."
keywords = ["torajs", "filesystem", "fs", "runtime", "ffi"]
categories = ["filesystem", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dual emit: `rlib` for cargo workspace + unit tests; `staticlib`
# emits libtorajs_fs.a so ssa_inkwell links it into every
# `tr build` AOT user binary alongside the other Layer-1+ staticlibs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# torajs-syscall (0 Cargo deps; direct svc, no libc) supplies the
# open/read/write/close + open_mode/fstat_size wrappers the fs
# entrypoints route through instead of std::fs — this drops libc
# (open/read/write/close/fstat) + std::io::Error (___error/strerror_r)
# + backtrace machinery from the user binary (16-e fs port). The
# remaining std::fs callers (unlink/mkdir/stat/readdir) migrate in
# step 3. Cross-tier extern calls (str_alloc_pooled, arr_alloc,
# arr_push, panic) resolve at `tr build` link time against
# libtorajs_str.a + libtorajs_arr.a + runtime_str.c — same pattern as
# the other Layer-3 sub-crates.
torajs-syscall = { path = "../torajs-syscall" }

[dev-dependencies]
torajs-bench = { path = "../torajs-bench" }

[[bench]]
name = "fs"
harness = false
