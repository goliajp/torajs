[package]
name = "torajs-crypto"
description = "Dependency-free no_std cryptographic primitives: SHA-256 / SHA-384 / SHA-512, HMAC, HKDF, AES-GCM, ChaCha20-Poly1305, constant-time helpers, and injectable entropy and CPU-feature interfaces. No allocator; unsafe only in the wiping routine and the hardware-instruction modules."
keywords = ["crypto", "aead", "aes-gcm", "chacha20poly1305", "no-std"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]
readme = "README.md"
documentation = "https://docs.rs/torajs-crypto"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]

[lints.rust]
warnings = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(torajs_crypto_portable)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
