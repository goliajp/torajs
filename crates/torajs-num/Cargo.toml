[package]
name = "torajs-num"
description = "Number primitives + Math namespace intrinsics for the torajs AOT TypeScript runtime. Layer-2 substrate of the architecture rewrite (`docs/architecture-rewrite.md` P3.2). Wraps libm via Rust f64 methods (sqrt / abs / floor / sin / log / pow / ...) and provides ToNumber per ES §7.1.4. no_std-friendly, 0 runtime deps."
keywords = ["torajs", "number", "math", "f64", "ecmascript"]
categories = ["mathematics", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-num"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dual emit: `rlib` for cargo workspace builds + unit tests + criterion
# bench harness; `staticlib` emits libtorajs_num.a so ssa_inkwell can
# link it into every `tr build` AOT user binary alongside libtorajs_str.a
# and the other Layer-1+ staticlibs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# v0.7-A3 Step 14-b — 0-libc buffered stdout for print_i64/f64 Rust path.
torajs-io = { path = "../torajs-io" }
# v0.7-A4 Step 15-d/e — 0-libc f64 ↔ string conversion (replaces
# libc snprintf %.*g try-precisions + strtod round-trip).
torajs-fmt = { path = "../torajs-fmt" }
# v0.7-A5 Step 16-c-3 — 0-libc Math.random seed via getentropy(2) svc
# (replaces SystemTime::now() which pulled clock_gettime / __error /
# strerror_r / memset libc syms into every Math.random user binary).
torajs-syscall = { path = "../torajs-syscall" }
# v0.7-A5 Step ⑦b — 0-libc IEEE-754 libm (fmod / pow / exp / log).
# Math.pow / .exp / .log thin wrappers now route through self-hosted
# polynomial implementations instead of f64::powf / .exp / .ln (which
# linked against libSystem libm). torajs-math is also wired into
# torajs-core's STATICLIBS for the user-binary `_fmod` shim.
torajs-math = { path = "../torajs-math" }
# Future ToNumber port (P3.2-c) will pull torajs-anyvalue (for AnyBox
# tag dispatch on any.toNumber) + torajs-throw (for RangeError on
# invalid numeric conversion edge cases).

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "num"
harness = false
