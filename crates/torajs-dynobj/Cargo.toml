[package]
name = "torajs-dynobj"
description = "Dynamic-property object substrate (open-addressing hashmap) for the torajs AOT TypeScript runtime. Backs `obj.x = v` / `arr.x = v` / `fn.x = v` property bags, with FNV-1a string-keyed buckets carrying ANY-tag/value + PropertyDescriptor attribute flags. Layer-3 — Swift-Dictionary / CPython-dict shape, implemented in-house with no external hash library. no_std-friendly."
keywords = ["torajs", "dynobj", "hashmap", "property-bag", "runtime"]
categories = ["data-structures", "no-std"]
readme = "README.md"
documentation = "https://docs.rs/torajs-dynobj"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# Dual emit: `rlib` for cargo workspace + unit tests;
# `staticlib` emits libtorajs_dynobj.a so the in-house link pipeline
# (torajs-link) bakes it into every `tr build` AOT user binary alongside the other Layer-1+
# staticlibs.
[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# v0.7-A2 step 6b — force-link mmalloc for `__torajs_libc_calloc/free`.
torajs-mmalloc = { path = "../torajs-mmalloc" }

[dev-dependencies]
torajs-bench = { path = "../torajs-bench" }
# The NaN-box encoding `src/nanbox.rs` restates is pinned to its owner
# by the tests there; only constants and inline encode/decode steps are
# used, so no archive member of either crate is linked into the tests.
torajs-anyvalue = { path = "../torajs-anyvalue" }
torajs-rc = { path = "../torajs-rc" }

[[bench]]
name = "dynobj"
harness = false
