[package]
name = "torajs-cli"
version = "0.1.0"
edition = "2024"

# v0.3 #6 Graduation — `tr` binary crate. Owns the CLI dispatch,
# `tr lsp` Language Server, and `tr lsp-bench` latency harness.
# Compiler internals live in torajs-core.

[[bin]]
name = "tr"
path = "src/main.rs"

[dependencies]
torajs-core = { path = "../torajs-core" }
# host-side consumer of the mid/family tables for the blade-2b
# dispatch stub judgment (cmd_build_dispatch_judge) — same in-house
# crate torajs-core already links for compile-time mid interning.
torajs-rc = { path = "../torajs-rc" }

# Self-hosted AOT toolchain: `tr build` routes through codegen + link
# (SSA → aarch64 emit → Mach-O link, no LLVM). The only pipeline since
# the ssa_inkwell/LLVM backend was retired (v0.7 Metal stone #6).
torajs-codegen = { path = "../torajs-codegen" }
torajs-link = { path = "../torajs-link" }

# Phase 0 step 8 — egraph mid-end optimizer wired into the new pipeline
# between `ssa_lower::lower_with_arity` and `torajs_codegen::compile_function`.
# Currently round-trip-equivalent (no rule cluster active); Phase 1+
# wires the first arithmetic + branch-folding rules. Honors
# `TORAJS_EGRAPH_OFF=1` env gate for bisection.
torajs-egraph = { path = "../torajs-egraph" }

# v0.3 #5 LSP — JSON-RPC framing + LSP type definitions for the
# `tr lsp` subcommand. Dev-tooling dep, not in any runtime path.
lsp-server = "0.8"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# V3-13 — `tr repl`. rustyline gives readline-style line editing
# (Emacs / vi modes), arrow-key history navigation, and on-disk
# history persistence. Used only by the `repl` subcommand path;
# no impact on normal `tr run` / `tr build` builds.
rustyline = "18"
