# torajs production AOT path: tr → SSA IR → native aarch64 codegen →
# in-house linker. This is the canonical `torajs` identity on the bench
# scoreboard.
name = "torajs"
detect = "{workspace}/target/release/tr --version"
src_filename = "main.ts"
compile = "{workspace}/target/release/tr build {src} -o {out}"
run = "{out}"
