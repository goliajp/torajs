# bun's standalone executable with its one ahead-of-time option on:
# `--bytecode` embeds JavaScriptCore bytecode for the bundled modules,
# so the binary skips parsing and bytecode generation at startup (the
# help text of bun 1.4.2 lists it next to --compile; `--format` defaults
# to cjs with it, which is what --compile uses anyway). Probed
# 2026-10-02 on mini with fib40's main.ts: the two binaries differ and a
# bare `bun build --bytecode --target=bun` of the same file writes a
# `.jsc` next to the .js, so the flag applies to a single .ts entry.
# `bun-aot` stays the default tier; both are reported.
name = "bun-aot-fast"
detect = "bun --version"
src_filename = "main.ts"
compile = "bun build --compile --bytecode {src} --outfile {out}"
run = "{out}"
