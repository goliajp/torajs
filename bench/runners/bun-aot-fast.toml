# bun's standalone executable with its one ahead-of-time option on:
# `--bytecode` embeds JavaScriptCore bytecode for the bundled modules,
# so the binary skips parsing and bytecode generation at startup (the
# help text of bun 1.4.2 lists it next to --compile). With --bytecode
# `--format` defaults to cjs, and a cjs bundle cannot hold a top-level
# await: the five promise / async cases fail to compile with
# `Expected ";" but found ")"`. bun 1.4.2 accepts esm bytecode only
# together with --compile ("ESM bytecode requires --compile"), which
# is the mode used here, so every case is built as esm.
# `bun-aot` stays the default tier; both are reported.
name = "bun-aot-fast"
detect = "bun --version"
src_filename = "main.ts"
compile = "bun build --compile --bytecode --format=esm {src} --outfile {out}"
run = "{out}"
