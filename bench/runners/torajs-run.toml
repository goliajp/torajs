# torajs `tr run` (dev-loop entry point): every invocation compiles the
# source in-process and then execs the produced binary, so run_ms is the
# whole compile plus the program's run. There is no compile step here and
# no cache in between; the `torajs` row measures the compile on its own.
name = "torajs-run"
detect = "{workspace}/target/release/tr --version"
src_filename = "main.ts"
run = "{workspace}/target/release/tr run {src}"
