# Bun's AOT mode: bundles the script + a full Bun runtime (JavaScriptCore +
# stdlib + GC) into a single ~60 MB native binary. Apples-to-apples vs
# torajs — both produce a standalone executable, both are timed end-to-end.
# Bun "wins" execution by carrying the JIT inside the binary; torajs wins
# size by ~1000× and avoids the JIT warmup tax.
#
# Known intermittent crash of bun 1.4.2 itself, both tiers: now and then
# a start dies with SIGTRAP (wait status 0x5) before the script runs.
# All 19 crash reports on mini 2026-09-26..10-03 (stack-pop-1m,
# array-copy-1m, split-only-100k, multibyte-concat-5m,
# promise-then-100k, regex-replace-callback-1m, and one plain `bun`
# run) carry the same binary uuid and the same single-thread stack:
# bun's crash handler re-raising after a fault in the startup
# call_once chain, just past a pthread_jit_write_protect_np(0) call.
# 5300 runs of promise-then-100k in the harness environment (fresh and
# reused binaries, serial and 6-way parallel) did not repeat it. The
# timed run fails the cell for that results file and is not retried;
# the pooled stamp reads the other files.
name = "bun-aot"
detect = "bun --version"
src_filename = "main.ts"
compile = "bun build --compile {src} --outfile {out}"
run = "{out}"
